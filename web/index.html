<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cardputer GPIO</title>
<style>
:root{
  --bg:#080a12; --panel:#141a28; --panel2:#1e2638; --line:#303a50;
  --text:#d6dce8; --dim:#768094; --faint:#485062;
  --title:#ffd440; --high:#2ae084; --low:#f04e4e; --warn:#ffa42a;
  --info:#3eb0ff; --accent:#966eff; --pink:#ff6ebe;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
a{color:var(--info)}
h2{font-size:15px;margin:0 0 10px;color:var(--title);font-weight:600}
h3{font-size:13px;margin:18px 0 8px;color:var(--dim);font-weight:600;
  text-transform:uppercase;letter-spacing:.08em}

header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header .name{color:var(--title);font-weight:700}
header .spacer{flex:1}
.stat{color:var(--dim);font-size:12px;white-space:nowrap}
.stat b{color:var(--text);font-weight:600}

.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;
  background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.pill.on{background:var(--high);color:#04120a;border-color:transparent}
.pill.warn{background:var(--warn);color:#1a1000;border-color:transparent}
.pill.err{background:var(--low);color:#fff;border-color:transparent}
.pill.info{background:var(--info);color:#04121e;border-color:transparent}

nav{display:flex;gap:2px;padding:0 12px;background:var(--panel);
  border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;
  color:var(--dim);padding:9px 14px;cursor:pointer;font:inherit;font-size:13px;
  white-space:nowrap}
nav button:hover{color:var(--text)}
nav button.sel{color:var(--title);border-bottom-color:var(--title)}

.wrap{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:18px;
  padding:18px;align-items:start;max-width:1500px;margin:0 auto}
@media(max-width:1080px){.wrap{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:14px;margin-bottom:14px}
aside{position:sticky;top:12px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--dim);font-weight:600;padding:5px 8px;
  border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;
  letter-spacing:.06em}
td{padding:5px 8px;border-bottom:1px solid #1c2334;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}

button.btn,select,input[type=text],input[type=password],input[type=number]{
  background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;font:inherit;font-size:12.5px}
button.btn{cursor:pointer}
button.btn:hover{border-color:var(--info);color:#fff}
button.btn.pri{background:var(--info);color:#04121e;border-color:transparent;font-weight:600}
button.btn.danger{background:var(--low);color:#fff;border-color:transparent}
button.btn:disabled{opacity:.4;cursor:not-allowed}
select:focus,input:focus{outline:1px solid var(--info)}
label.row{display:flex;align-items:center;gap:10px;padding:6px 0;
  border-bottom:1px solid #1c2334}
label.row span.k{flex:1;color:var(--dim)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.tool{background:var(--panel2);border:1px solid var(--line);border-radius:7px;
  padding:11px;cursor:pointer;border-left:3px solid var(--line)}
.tool:hover{border-color:var(--info);border-left-color:var(--info)}
.tool.sel{border-color:var(--title);border-left-color:var(--title)}
.tool .n{font-weight:600;color:var(--text)}
.tool .b{color:var(--dim);font-size:12px;margin-top:2px}
.tool .c{font-size:10.5px;color:var(--faint);margin-top:6px;text-transform:uppercase;
  letter-spacing:.07em}
.cat-Digital{border-left-color:var(--high)!important}
.cat-Analog{border-left-color:var(--warn)!important}
.cat-Signal{border-left-color:var(--accent)!important}
.cat-Bus{border-left-color:var(--pink)!important}
.cat-System{border-left-color:var(--info)!important}

/* ── Mirrored screen ── */
.screen{background:#000;border:1px solid var(--line);border-radius:6px;
  padding:8px;display:flex;justify-content:center}
canvas{image-rendering:pixelated;width:480px;max-width:100%;height:auto;
  display:block;border-radius:2px}
.screen.cap{border-color:var(--high);box-shadow:0 0 0 1px var(--high)}

.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
.pad button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:5px;padding:8px 0;cursor:pointer;font:inherit;font-size:12px}
.pad button:hover{border-color:var(--info);color:#fff}
.pad button:active{background:var(--info);color:#04121e}
.pad .wide{grid-column:span 2}

.hint{color:var(--faint);font-size:11.5px;margin-top:8px;line-height:1.5}
.note{background:#1a1206;border:1px solid #4a3a12;color:var(--warn);
  border-radius:6px;padding:9px 11px;font-size:12.5px;margin-bottom:12px}
.note.bad{background:#1e0c0c;border-color:#5a2020;color:#ff9a9a}
.note.ok{background:#07180f;border-color:#1d4a30;color:var(--high)}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--info);color:var(--text);
  padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;
  transition:opacity .18s;pointer-events:none;z-index:50;max-width:80vw}
#toast.show{opacity:1}
#toast.bad{border-color:var(--low);color:#ffbdbd}

.mono{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.warnpin{color:var(--warn)}
.badpin{color:var(--low)}
.okpin{color:var(--high)}
.small{font-size:11.5px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>

<header>
  <span class="name">Cardputer GPIO</span>
  <span class="pill" id="hState">…</span>
  <span class="stat" id="hTool"></span>
  <span class="spacer"></span>
  <span class="pill err" id="hRec" hidden>REC</span>
  <span class="stat" id="hRadio"></span>
  <span class="stat" id="hHeap"></span>
  <span class="stat" id="hBatt"></span>
  <span class="pill" id="hConn">offline</span>
</header>

<nav id="nav"></nav>

<div class="wrap">
  <main id="main"></main>

  <aside>
    <div class="card">
      <h2>Device screen</h2>
      <div class="screen" id="screenBox" title="click to capture your keyboard">
        <canvas id="cv" width="240" height="135"></canvas>
      </div>

      <div class="pad">
        <button data-k="esc">ESC</button>
        <button data-k="tab">TAB</button>
        <button data-k="up">▲</button>
        <button data-k="f1">F1</button>
        <button data-k="f2">F2</button>
        <button data-k="back">DEL</button>

        <button data-k="left">◀</button>
        <button data-k="down">▼</button>
        <button data-k="right">▶</button>
        <button data-k="enter" class="wide">ENTER</button>
        <button id="capBtn">⌨ off</button>
      </div>

      <div class="flex" style="margin-top:8px">
        <input type="text" id="typeBox" placeholder="type text to send…" style="flex:1">
        <button class="btn" id="typeBtn">Send</button>
      </div>

      <p class="hint">
        Click the screen (or the ⌨ button) to capture your keyboard: arrows,
        Esc, Tab, Enter, Backspace and F1–F10 all map straight through, so you
        do not need the device's Fn layer. Press <b>Esc</b> twice to release.
      </p>
    </div>
  </aside>
</div>

<div id="toast"></div>

<script>
"use strict";

// ── Plumbing ──────────────────────────────────────────────────────────────
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

let online = false;

async function api(path, opts) {
  const r = await fetch(path, Object.assign({ cache: "no-store" }, opts));
  if (r.status === 401) {
    // A 401 answered to fetch() does not reliably raise the browser's own
    // password box, but one answered to a navigation always does. Reloading
    // gets the user asked exactly once; every later request then carries the
    // credentials. This cannot loop: reaching here means the document
    // request already passed, so the password must have just changed.
    location.reload();
    throw new Error("password required");
  }
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((body && body.error) || ("HTTP " + r.status));
  return body;
}
const post = (path, params) =>
  api(path + (params ? "?" + new URLSearchParams(params) : ""), { method: "POST" });

let toastTimer = null;
function toast(msg, bad) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "show" + (bad ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = ""), 2600);
}
const fail = e => toast(e.message || String(e), true);

// ── Router ────────────────────────────────────────────────────────────────
// Must match CG_WEB_USER in src/core/Config.h.
const WEB_USER = "cardputer";

const PAGES = [
  ["tools",    "Tools",    renderTools],
  ["pins",     "Pins",     renderPins],
  ["setups",   "Setups",   renderSetups],
  ["settings", "Settings", renderSettings],
  ["board",    "Board",    renderBoard],
  ["logs",     "Logs",     renderLogs],
];
let page = location.hash.slice(1) || "tools";
if (!PAGES.some(p => p[0] === page)) page = "tools";

function buildNav() {
  $("#nav").innerHTML = PAGES.map(
    ([id, label]) => `<button data-p="${id}">${label}</button>`).join("");
  $$("#nav button").forEach(b =>
    b.onclick = () => { page = b.dataset.p; location.hash = page; draw(); });
}

function draw() {
  $$("#nav button").forEach(b => b.classList.toggle("sel", b.dataset.p === page));
  const p = PAGES.find(x => x[0] === page);
  $("#main").innerHTML = '<div class="card dim">loading…</div>';
  p[2]().catch(e => {
    $("#main").innerHTML = `<div class="card"><div class="note bad">${esc(e.message)}</div></div>`;
  });
}
window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (h && h !== page && PAGES.some(p => p[0] === h)) { page = h; draw(); }
});

// ── Header / state poll ───────────────────────────────────────────────────
let state = null;

async function pollState() {
  try {
    state = await api("/api/state");
    if (!online) { online = true; draw(); }
    $("#hConn").textContent = "online";
    $("#hConn").className = "pill on";
  } catch (e) {
    online = false;
    $("#hConn").textContent = "offline";
    $("#hConn").className = "pill err";
    return;
  }

  const s = state;
  const sp = $("#hState");
  sp.textContent = s.state;
  sp.className = "pill " + (s.state === "running" ? "on" : "info");

  $("#hTool").innerHTML = s.tool
    ? `<b>${esc(s.tool.name)}</b> <span class="dim">${esc(s.tool.blurb)}</span>`
    : '<span class="dim">no tool open</span>';

  $("#hRec").hidden = !s.log.active;
  if (s.log.active) $("#hRec").textContent = "REC " + s.log.rows + " rows";

  $("#hRadio").innerHTML = s.wifi.running
    ? `${esc(s.wifi.status)} · <b>${esc(s.wifi.ip || "…")}</b>`
    : "";
  $("#hHeap").innerHTML = "heap <b>" + Math.round(s.heap / 1024) + "k</b>";
  $("#hBatt").innerHTML = s.batt >= 0 ? "batt <b>" + s.batt + "%</b>" : "";

  if (typeof onStateTick === "function") onStateTick(s);
}

let onStateTick = null;

// ── Mirrored screen ───────────────────────────────────────────────────────
const cv  = $("#cv");
const ctx = cv.getContext("2d", { willReadFrequently: false });
const img = ctx.createImageData(240, 135);
let screenBusy = false, needFull = true;

async function pollScreen() {
  if (screenBusy || document.hidden || !online) return;
  screenBusy = true;
  try {
    const r = await fetch("/api/screen?full=" + (needFull ? 1 : 0), { cache: "no-store" });
    if (!r.ok) throw 0;
    const b = new Uint8Array(await r.arrayBuffer());
    if (b.length < 10 || b[0] !== 67 || b[1] !== 71 || b[2] !== 83) throw 0;

    const cols = b[4], tw = b[6], th = b[7];
    const count = b[8] | (b[9] << 8);
    const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
    const d = img.data;
    let off = 10;

    for (let i = 0; i < count; i++) {
      const idx = dv.getUint16(off, true); off += 2;
      const tx = (idx % cols) * tw, ty = ((idx / cols) | 0) * th;
      for (let y = 0; y < th; y++) {
        let p = ((ty + y) * 240 + tx) * 4;
        for (let x = 0; x < tw; x++, off += 2, p += 4) {
          const c = dv.getUint16(off, true);
          d[p]     = ((c >> 11) & 31) * 527 + 23 >> 6;
          d[p + 1] = ((c >> 5) & 63) * 259 + 33 >> 6;
          d[p + 2] = (c & 31) * 527 + 23 >> 6;
          d[p + 3] = 255;
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    needFull = false;
  } catch (e) {
    needFull = true;
  } finally {
    screenBusy = false;
  }
}

// ── Key injection ─────────────────────────────────────────────────────────
const sendKey = (k, extra) => post("/api/key", Object.assign({ k }, extra || {}))
  .catch(() => {});

$$(".pad button[data-k]").forEach(b => b.onclick = () => sendKey(b.dataset.k));

$("#typeBtn").onclick = async () => {
  const box = $("#typeBox");
  for (const ch of box.value) {
    const c = ch.charCodeAt(0);
    if (c >= 32 && c <= 126) await sendKey("char", { c });
  }
  box.value = "";
};
$("#typeBox").addEventListener("keydown", e => {
  e.stopPropagation();
  if (e.key === "Enter") $("#typeBtn").click();
});

let capture = false;
function setCapture(on) {
  capture = on;
  $("#capBtn").textContent = on ? "⌨ ON" : "⌨ off";
  $("#screenBox").classList.toggle("cap", on);
}
$("#capBtn").onclick = () => setCapture(!capture);
$("#screenBox").onclick = () => setCapture(true);

const KEYMAP = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  Enter: "enter", Backspace: "back", Escape: "esc", Tab: "tab", Delete: "fdel",
};

let lastEsc = 0;
document.addEventListener("keydown", e => {
  if (!capture) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;

  if (e.key === "Escape") {
    // Two quick presses of Esc give the keyboard back to the browser.
    const now = Date.now();
    if (now - lastEsc < 500) { setCapture(false); e.preventDefault(); return; }
    lastEsc = now;
  }

  let k = KEYMAP[e.key];
  if (!k && /^F([1-9]|10)$/.test(e.key)) k = e.key.toLowerCase();

  const mods = { ctrl: e.ctrlKey ? 1 : 0, shift: e.shiftKey ? 1 : 0, alt: e.altKey ? 1 : 0 };
  if (k) {
    sendKey(k, mods);
  } else if (e.key.length === 1) {
    const c = e.key.charCodeAt(0);
    if (c < 32 || c > 126) return;
    sendKey("char", Object.assign({ c }, mods));
  } else {
    return;
  }
  e.preventDefault();
});

// ── Page: Tools ───────────────────────────────────────────────────────────
let toolsCache = null;

async function loadTools(force) {
  if (!toolsCache || force) toolsCache = await api("/api/tools");
  return toolsCache;
}

async function renderTools() {
  const tools = await loadTools(true);
  const cur = state && state.tool ? state.tool.id : null;

  const byCat = {};
  tools.forEach(t => (byCat[t.cat] = byCat[t.cat] || []).push(t));

  let html = "";
  for (const cat of ["Digital", "Analog", "Signal", "Bus", "System"]) {
    if (!byCat[cat]) continue;
    html += `<h3>${cat}</h3><div class="grid">` + byCat[cat].map(t => `
      <div class="tool cat-${cat} ${t.id === cur ? "sel" : ""}" data-id="${t.id}">
        <div class="n">${esc(t.name)}</div>
        <div class="b">${esc(t.blurb)}</div>
        <div class="c">${t.roles.length ? t.roles.length + (t.roles.length === 1 ? " pin" : " pins") : "no wiring"}${
          t.drives ? " · drives outputs" : ""}${t.canLog ? " · logs" : ""}</div>
      </div>`).join("") + "</div>";
  }

  $("#main").innerHTML =
    `<div class="card"><h2>Tools</h2>
       <p class="hint" style="margin-top:0">Opening a tool here does exactly what
       picking it on the device does: it goes to the wiring screen first, and
       anything that drives a pin still asks to be armed.</p>
     </div>
     <div class="card" id="toolRun"></div>
     <div class="card">${html}</div>`;

  $$(".tool").forEach(el => el.onclick = async () => {
    try {
      await post("/api/tool/open", { id: el.dataset.id });
      needFull = true;
      toast("opened " + el.querySelector(".n").textContent);
      await pollState();
      renderRun();
    } catch (e) { fail(e); }
  });

  runSig = "";
  onStateTick = () => renderRun();
  renderRun();
}

let runSig = "";

function renderRun() {
  const box = $("#toolRun");
  if (!box || !state) return;
  const t = state.tool;

  // Only rebuild when something actually changed: this runs on every state
  // poll, and re-writing the panel each second would wipe the live readout
  // and lose focus a user is in the middle of.
  const sig = [state.state, t ? t.id : "", state.log.active].join("|");
  if (sig === runSig) return;
  runSig = sig;

  if (!t) {
    box.innerHTML = '<h2>Nothing open</h2><p class="dim small">Pick a tool below.</p>';
    return;
  }

  const running = state.state === "running";
  const arming  = state.state === "arm";

  box.innerHTML = `
    <h2>${esc(t.name)}</h2>
    <div class="flex" style="margin-bottom:10px">
      <span class="pill ${running ? "on" : "info"}">${esc(state.state)}</span>
      ${t.drives ? '<span class="pill warn">drives outputs</span>' : ""}
      ${t.canLog ? '<span class="pill">loggable</span>' : ""}
    </div>
    ${arming ? '<div class="note">This tool drives pins. Confirm to let it start.</div>' : ""}
    <div class="flex">
      ${running
        ? '<button class="btn" id="bBack">Close tool</button>'
        : `<button class="btn pri" id="bStart">${arming ? "Confirm and start" : "Start"}</button>
           <button class="btn" id="bBack">Back to menu</button>`}
      ${t.canLog
        ? (state.log.active
            ? '<button class="btn danger" id="bLog">Stop logging</button>'
            : '<button class="btn" id="bLog">Start logging</button>')
        : ""}
    </div>
    <div id="liveBox"></div>`;

  const b = id => $("#" + id);
  if (b("bStart")) b("bStart").onclick = async () => {
    try {
      const r = await post("/api/tool/start", arming ? { confirm: 1 } : {});
      needFull = true;
      if (r.needsArm) toast("this tool drives pins — confirm to start");
      await pollState();
      renderRun();
    } catch (e) { fail(e); }
  };
  if (b("bBack")) b("bBack").onclick = async () => {
    try { await post("/api/tool/back"); needFull = true; await pollState(); renderRun(); }
    catch (e) { fail(e); }
  };
  if (b("bLog")) b("bLog").onclick = async () => {
    try {
      const r = await post("/api/log/ctl", { action: state.log.active ? "stop" : "start" });
      toast(state.log.active ? "stopped" : ("logging to " + (r.sd ? r.file : "serial only")));
      await pollState();
      renderRun();
    } catch (e) { fail(e); }
  };
}

// ── Live values ───────────────────────────────────────────────────────────
async function pollLive() {
  const box = $("#liveBox");
  if (!box || document.hidden || !online) return;
  if (!state || state.state !== "running" || !state.tool || !state.tool.canLog) {
    box.innerHTML = "";
    return;
  }
  try {
    const l = await api("/api/live");
    if (!l.has) { box.innerHTML = ""; return; }
    const cols = l.header.split(",");
    const vals = (l.row || "").split(",");
    box.innerHTML = `<h3>Live</h3><table><tr>${
      cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr><tr>${
      cols.map((_, i) => `<td class="num mono">${esc(vals[i] || "—")}</td>`).join("")}</tr></table>`;
  } catch (e) { /* the tool may have closed mid-request */ }
}

// ── Page: Pins ────────────────────────────────────────────────────────────
async function renderPins() {
  const [tools, pins] = await Promise.all([loadTools(true), api("/api/pins")]);

  const opts = (dir, sel) => {
    const usable = pins.filter(p => (dir === "ADC" ? p.adcOk : p.gpioOk));
    return `<option value="-1"${sel < 0 ? " selected" : ""}>— none —</option>` +
      usable.map(p => `<option value="${p.gpio}"${p.gpio === sel ? " selected" : ""}>G${
        p.gpio} · ${esc(p.header)} (${esc(p.silk)})</option>`).join("");
  };

  // A pin used twice inside one tool is nearly always a mistake, so say so.
  const dupes = t => {
    const seen = {}, bad = {};
    t.roles.forEach(r => {
      if (r.pin < 0) return;
      if (seen[r.pin]) bad[r.pin] = true;
      seen[r.pin] = true;
    });
    return bad;
  };

  const withRoles = tools.filter(t => t.roles.length);

  $("#main").innerHTML = `
    <div class="card">
      <h2>Pin assignment</h2>
      ${state && state.radio ? `<div class="note">The radio is on, so ADC2
        (G13, G15) cannot be read and is missing from ADC lists. Turn WiFi off
        in Settings to get those two back as analog inputs.</div>` : ""}
      ${state && !state.sdPins ? `<div class="hint" style="margin-top:0">G14, G39
        and G40 are hidden because they are shared with the microSD bus. Enable
        <b>allow SD pins</b> in Settings to use them.</div>` : ""}
    </div>

    <div class="card">
      <h2>Live pin state</h2>
      <table>
        <tr><th>Pin</th><th>Where</th><th>Silk</th><th>Mode</th><th>Level</th><th class="num">mV</th><th>Notes</th></tr>
        ${pins.map(p => `<tr>
          <td class="${p.locked ? "badpin" : p.sd ? "warnpin" : "okpin"}">G${p.gpio}</td>
          <td class="dim">${esc(p.header)}</td>
          <td>${esc(p.silk)}</td>
          <td class="dim">${esc(p.mode)}</td>
          <td>${p.level === null ? '<span class="dim">—</span>'
                : p.level ? '<span class="okpin">HIGH</span>' : '<span class="badpin">LOW</span>'}</td>
          <td class="num mono">${p.mv === null ? '<span class="dim">—</span>' : p.mv}</td>
          <td class="dim small">${esc(p.warn || (p.locked ? "locked" : ""))}</td>
        </tr>`).join("")}
      </table>
    </div>

    ${withRoles.map(t => {
      const bad = dupes(t);
      return `<div class="card">
        <h2>${esc(t.name)}</h2>
        <table>
        ${t.roles.map(r => `<tr>
          <td style="width:90px"><b>${esc(r.label)}</b></td>
          <td style="width:46px"><span class="pill">${esc(r.dir)}</span></td>
          <td class="dim small">${esc(r.hint)}</td>
          <td style="width:250px">
            <select data-tool="${t.id}" data-role="${r.i}" data-dir="${r.dir}"
              ${bad[r.pin] ? 'style="border-color:var(--warn)"' : ""}>
              ${opts(r.dir, r.pin)}
            </select>
          </td>
        </tr>`).join("")}
        </table>
        ${Object.keys(bad).length
          ? '<div class="note" style="margin:10px 0 0">Two roles share a pin.</div>' : ""}
      </div>`;
    }).join("")}`;

  $$("select[data-tool]").forEach(sel => sel.onchange = async () => {
    try {
      await post("/api/pin", {
        tool: sel.dataset.tool, role: sel.dataset.role, gpio: sel.value });
      toast("saved");
      toolsCache = null;
    } catch (e) {
      fail(e);
      renderPins();
    }
  });

  onStateTick = null;
}

// ── Page: Setups ──────────────────────────────────────────────────────────
async function renderSetups() {
  const slots = await api("/api/setups");

  $("#main").innerHTML = `
    <div class="card">
      <h2>Saved setups</h2>
      <p class="hint" style="margin-top:0">A setup is every tool's pin
      assignment saved together. Handy when you keep more than one rig: save
      one for the EXT header and one for Grove, and switching is one click.</p>
      <table>
        <tr><th style="width:40px">#</th><th>Name</th><th class="num">Tools</th><th style="width:250px"></th></tr>
        ${slots.map(s => `<tr>
          <td class="dim">${s.slot + 1}</td>
          <td>${s.used ? esc(s.name)
                : '<span class="dim">— empty —</span>'}</td>
          <td class="num dim">${s.used ? s.tools : ""}</td>
          <td class="flex">
            <button class="btn" data-a="save" data-s="${s.slot}">Save here</button>
            <button class="btn pri" data-a="load" data-s="${s.slot}" ${s.used ? "" : "disabled"}>Load</button>
            <button class="btn danger" data-a="delete" data-s="${s.slot}" ${s.used ? "" : "disabled"}>×</button>
          </td>
        </tr>`).join("")}
      </table>
    </div>`;

  $$("button[data-a]").forEach(b => b.onclick = async () => {
    const action = b.dataset.a, slot = b.dataset.s;
    try {
      if (action === "save") {
        const name = prompt("Name for this setup:", slots[slot].name || "rig " + (+slot + 1));
        if (name === null) return;
        await post("/api/setup", { action, slot, name: name.slice(0, 12) });
      } else if (action === "delete") {
        if (!confirm("Delete setup " + (+slot + 1) + "?")) return;
        await post("/api/setup", { action, slot });
      } else {
        await post("/api/setup", { action, slot });
        toolsCache = null;
      }
      toast(action + "d");
      renderSetups();
    } catch (e) { fail(e); }
  });

  onStateTick = null;
}

// ── Page: Settings ────────────────────────────────────────────────────────
async function renderSettings() {
  const s = await api("/api/settings");
  const w = state ? state.wifi
                  : { mode: 0, ssid: "", staSsid: "", auto: false,
                      status: "off", locked: false };

  $("#main").innerHTML = `
    <div class="card">
      <h2>Device</h2>
      <label class="row"><span class="k">Brightness</span>
        <input type="number" id="sBright" min="10" max="255" value="${s.brightness}" style="width:90px"></label>
      <label class="row"><span class="k">Key beep</span>
        <input type="checkbox" id="sBeep" ${s.beep ? "checked" : ""}></label>
      <label class="row"><span class="k">Arm before driving outputs</span>
        <input type="checkbox" id="sArm" ${s.armOutputs ? "checked" : ""}></label>
      <label class="row"><span class="k">Allow microSD pins (G14/G39/G40)</span>
        <input type="checkbox" id="sSd" ${s.allowSdPins ? "checked" : ""}></label>
      <label class="row"><span class="k">Log interval (ms)</span>
        <input type="number" id="sLog" min="20" max="5000" step="20" value="${s.logInterval}" style="width:90px"></label>
      <div class="flex" style="margin-top:12px">
        <button class="btn pri" id="sSave">Save</button>
      </div>
      <p class="hint">Turning off <b>arm before driving outputs</b> lets a tool
      start sourcing current the moment it opens, using pins you may have
      assigned weeks ago. Leave it on unless you know what is wired.</p>
    </div>

    <div class="card">
      <h2>WiFi</h2>
      <div class="note ${w.running ? "ok" : ""}" style="margin-bottom:12px">
        ${w.running
          ? `${esc(w.status)} · <b>${esc(w.ip || "waiting for an address")}</b>
             ${w.mode === 1 ? ` · SSID <b>${esc(w.ssid)}</b> · ${w.clients} client(s)`
                            : ` · ${w.rssi} dBm`}
             · also at <b>http://${esc(w.host)}.local</b>`
          : "The radio is off."}
      </div>

      <label class="row"><span class="k">Mode</span>
        <select id="wMode">
          <option value="0" ${w.mode === 0 ? "selected" : ""}>Off</option>
          <option value="1" ${w.mode === 1 ? "selected" : ""}>Access point (standalone)</option>
          <option value="2" ${w.mode === 2 ? "selected" : ""}>Join a network</option>
        </select></label>
      <label class="row"><span class="k">Network name (to join)</span>
        <input type="text" id="wSsid" value="${esc(w.staSsid || "")}"></label>
      <label class="row"><span class="k">Password</span>
        <input type="password" id="wPass" placeholder="unchanged"></label>
      <label class="row"><span class="k">Start the radio at boot</span>
        <input type="checkbox" id="wAuto" ${w.auto ? "checked" : ""}></label>

      <div class="flex" style="margin-top:12px">
        <button class="btn" id="wSaveCreds">Save network</button>
        <button class="btn pri" id="wApply">Apply mode</button>
      </div>
      <p class="hint">
        Changing the mode restarts the radio, so this page will drop for a few
        seconds — and if you switch to a different network, you will need to
        reconnect from that network's address. The device screen always shows
        the current address under the WiFi tool.
        <br><br>
        <b>ADC2 warning:</b> while the radio is up, G13 and G15 cannot be used
        as analog inputs. Everything else is unaffected.
      </p>
    </div>

    <div class="card">
      <h2>Access</h2>
      <div class="hint" style="margin-bottom:10px">
        ${w.locked
          ? `This interface asks for a password. The username is
             <b>${esc(WEB_USER)}</b>.`
          : `<b>Anyone who can reach this address can drive the pins.</b>
             On the board's own access point that is fine — the radio is
             already WPA2. On a shared network, set a password.`}
      </div>
      <label class="row"><span class="k">Web password</span>
        <input type="password" id="aPass" autocomplete="new-password"
               placeholder="${w.locked ? "unchanged" : "no password set"}"></label>
      <div class="flex" style="margin-top:12px">
        <button class="btn pri" id="aSet">Set password</button>
        ${w.locked ? `<button class="btn danger" id="aClear">Remove password</button>` : ""}
      </div>
      <p class="hint">
        The browser will ask for it on the next request, and remember it for
        the rest of the session. It is stored on the device and survives a
        reboot; a factory reset clears it. Forgetting it costs you a factory
        reset from the device, not a reflash.
      </p>
    </div>`;

  $("#sSave").onclick = async () => {
    try {
      await post("/api/settings", {
        brightness: $("#sBright").value,
        beep: $("#sBeep").checked ? 1 : 0,
        armOutputs: $("#sArm").checked ? 1 : 0,
        allowSdPins: $("#sSd").checked ? 1 : 0,
        logInterval: $("#sLog").value,
      });
      toolsCache = null;
      toast("saved");
    } catch (e) { fail(e); }
  };

  $("#aSet").onclick = async () => {
    const v = $("#aPass").value;
    if (!v) { toast("type a password first"); return; }
    try {
      await post("/api/wifi", { webPass: v });
      toast("password set — reloading so the browser can ask for it");
      setTimeout(() => location.reload(), 900);
    } catch (e) { fail(e); }
  };

  if ($("#aClear")) $("#aClear").onclick = async () => {
    if (!confirm("Remove the password? Anyone who can reach this address " +
                 "will be able to drive the pins.")) return;
    try {
      await post("/api/wifi", { webPass: "" });
      toast("password removed");
      await pollState();     // draw() reads the cached state, so refresh first
      draw();
    } catch (e) { fail(e); }
  };

  $("#wSaveCreds").onclick = async () => {
    try {
      const p = { ssid: $("#wSsid").value, auto: $("#wAuto").checked ? 1 : 0 };
      if ($("#wPass").value) p.pass = $("#wPass").value;
      await post("/api/wifi", p);
      toast("network saved");
    } catch (e) { fail(e); }
  };

  $("#wApply").onclick = async () => {
    const mode = $("#wMode").value;
    if (!confirm("Restart the radio now? This page will drop briefly.")) return;
    try {
      const p = { mode, auto: $("#wAuto").checked ? 1 : 0 };
      if ($("#wSsid").value) p.ssid = $("#wSsid").value;
      if ($("#wPass").value) p.pass = $("#wPass").value;
      await post("/api/wifi", p);
    } catch (e) { /* the reply is cut short on purpose */ }
    toast("restarting the radio…");
  };

  onStateTick = null;
}

// ── Page: Board ───────────────────────────────────────────────────────────
async function renderBoard() {
  const [b, pins] = await Promise.all([api("/api/board"), api("/api/pins")]);

  const flag = (on, label, cls) => on ? `<span class="pill ${cls || ""}">${label}</span> ` : "";

  $("#main").innerHTML = `
    <div class="card">
      <h2>${esc(b.name)}</h2>
      ${b.adv ? "" : '<div class="note bad">This is not a Cardputer ADV — the pin map below does not apply.</div>'}
      <table>
        <tr><td class="dim">Flash</td><td>${b.flashMB} MB</td></tr>
        <tr><td class="dim">PSRAM</td><td>${b.psramKB ? b.psramKB + " KB" : "none"}</td></tr>
        <tr><td class="dim">Free heap</td><td>${Math.round(b.heap / 1024)} KB</td></tr>
      </table>
    </div>

    <div class="card">
      <h2>Headers</h2>
      <table>
        <tr><th>Pin</th><th>Where</th><th>Silk</th><th>Flags</th><th>Notes</th></tr>
        ${pins.map(p => `<tr>
          <td class="${p.locked ? "badpin" : p.sd ? "warnpin" : "okpin"}">G${p.gpio}</td>
          <td class="dim">${esc(p.header)}</td>
          <td>${esc(p.silk)}</td>
          <td>${flag(p.locked, "LOCK", "err")}${flag(p.sd, "SD", "warn")}${
               flag(p.adc1, "ADC1")}${flag(p.adc2, "ADC2")}${flag(p.grove, "GROVE")}</td>
          <td class="dim small">${esc(p.warn || "")}</td>
        </tr>`).join("")}
      </table>
      <p class="hint"><b>LOCK</b> — the system I²C bus the keyboard controller
      sits on; driving it costs a reflash, so it is refused everywhere.
      <b>SD</b> — shared with the card reader, hidden until you opt in.</p>
    </div>

    <div class="card">
      <h2>Internal peripherals</h2>
      <table>${b.periph.map(p => `<tr>
        <td class="dim" style="width:180px">${esc(p.what)}</td>
        <td>${esc(p.pins)}</td></tr>`).join("")}</table>
    </div>`;

  onStateTick = null;
}

// ── Page: Logs ────────────────────────────────────────────────────────────
async function renderLogs() {
  const l = await api("/api/logs");

  $("#main").innerHTML = `
    <div class="card">
      <h2>Captures on the card</h2>
      ${l.ok ? "" : `<div class="note">${esc(l.error)} — captures are still
        written to USB serial, and any tool that measures can log with F2.</div>`}
      ${l.ok && !l.files.length ? '<p class="dim small">Nothing recorded yet.</p>' : ""}
      ${l.files.length ? `<table>
        <tr><th>File</th><th class="num">Size</th><th style="width:110px"></th></tr>
        ${l.files.map(f => `<tr>
          <td>${esc(f.name)}</td>
          <td class="num mono">${(f.size / 1024).toFixed(1)} kB</td>
          <td><a class="btn" style="text-decoration:none;display:inline-block"
                 href="/api/log?f=${encodeURIComponent(f.name)}">Download</a></td>
        </tr>`).join("")}</table>` : ""}
      <p class="hint">Logging is started from the tool that is running — open a
      tool that measures and use the button there, or press <b>F2</b> on the
      device. Rows are written to the card and to USB serial at 115200.</p>
    </div>`;

  onStateTick = null;
}

// ── Go ────────────────────────────────────────────────────────────────────
buildNav();
pollState().then(draw);
setInterval(pollState, 1000);
setInterval(pollScreen, 180);
setInterval(pollLive, 600);
document.addEventListener("visibilitychange", () => { if (!document.hidden) needFull = true; });
</script>
</body>
</html>
